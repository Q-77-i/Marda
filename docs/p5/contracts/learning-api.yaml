openapi: 3.1.0
info:
  title: Marda Learning API
  version: 0.1.0
  description: |
    P5-J1 契约骨架（评审稿）。公开业务 API 由 Java 网关暴露；内部 API 只允许内网服务调用。
    现有 Python 面试 API 不在本契约内：面试 SSE / WebSocket 仍是 nginx → agent 直连。
    计划创建的主路径是 `interview.finalized` 事件消费，不是浏览器同步调用。
servers:
  - url: http://localhost:8080
    description: 本地 compose（nginx / gateway 入口）
tags:
  - name: learning
    description: 学习计划 / 任务 / 提醒（浏览器 → 网关 → business）
  - name: internal
    description: 服务间内部 API（仅内网；service token）
security:
  - bearerAuth: []
paths:
  /api/v1/learning/plans:
    get:
      tags: [learning]
      summary: 列出当前用户的学习计划
      operationId: listLearningPlans
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed, archived]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分页计划列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlans'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [learning]
      summary: 从报告创建学习计划（可选入口）
      description: |
        主路径是 `interview.finalized` 事件消费；此端点用于用户显式创建 / 运营补偿。
        同一 `Idempotency-Key` + 同一请求体重复调用返回已有计划（200）；不同请求体返回 409。
      operationId: createLearningPlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: 新计划已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '200':
          description: 幂等重放，返回已有计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/plans/{plan_id}:
    get:
      tags: [learning]
      summary: 读取计划详情
      operationId: getLearningPlan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 计划详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/tasks/{task_id}:
    patch:
      tags: [learning]
      summary: 更新任务状态 / 截止时间
      description: 必须带当前 `version`；版本不一致返回 409，由客户端刷新后重试。
      operationId: updateLearningTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/today:
    get:
      tags: [learning]
      summary: 今日任务
      operationId: getTodayTasks
      responses:
        '200':
          description: 今日任务列表（无任务时为空数组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/reminders/test:
    post:
      tags: [learning]
      summary: 发送一条测试提醒
      description: MVP 只支持 in_app；email / webhook 等渠道在 J3 评审后补契约。
      operationId: sendTestReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderTestRequest'
      responses:
        '202':
          description: 已受理，通知异步发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/v1/learning-plans/from-report:
    post:
      tags: [internal]
      summary: 从面试收尾事件创建计划（内部）
      description: |
        由 `interview.finalized` 消费者调用；按 `source_interview_id` 幂等。
        仅内网；service token + `X-User-Id`。
      operationId: createPlanFromReport
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './interview-finalized.schema.json'
      responses:
        '201':
          description: 新计划已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '200':
          description: 幂等重放，返回已有计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/v1/learning-plans/{user_id}/next:
    get:
      tags: [internal]
      summary: 读取用户的下一步学习建议（内部只读）
      description: |
        Agent 出题 / 报告个性化输入；失败时调用方按空结果处理，不阻断面试。
      operationId: getNextLearningTasks
      security:
        - serviceToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
      responses:
        '200':
          description: 下一步任务；没有计划时返回空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 浏览器 → 网关的 JWT；业务服务不直接接受用户 JWT。
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 内网服务 token；只允许业务服务 / worker 持有。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 创建计划时使用 `source_interview_id`；同一 key + 同一请求体幂等。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: 网关 / 内部调用方注入的用户 ID；业务服务不信任请求体里的 user_id。
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证 / token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权访问（内部 API 的 service token 不匹配）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 不存在或越权（统一 404，不泄露存在性）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 幂等冲突 / 版本冲突 / 状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 语义校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 限流；响应带 Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 依赖不可用 / 熔断
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [NOT_FOUND, VERSION_CONFLICT, RATE_LIMITED]
        message:
          type: string
        request_id:
          type: string
          description: 网关 / 业务服务注入的请求 ID，用于排障。
        details:
          type: object
          additionalProperties: true
    LearningPlan:
      type: object
      additionalProperties: false
      required:
        [id, user_id, source_interview_id, goal, status, version, created_at, updated_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        source_interview_id:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active, completed, archived]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LearningTask'
    LearningTask:
      type: object
      additionalProperties: false
      required: [id, plan_id, domain, title, status, priority, version]
      properties:
        id:
          type: string
        plan_id:
          type: string
        domain:
          type: string
        title:
          type: string
        resource_url:
          type: [string, "null"]
          format: uri
        status:
          type: string
          enum: [todo, in_progress, done, skipped]
        due_at:
          type: [string, "null"]
          format: date-time
        priority:
          type: integer
          minimum: 1
          maximum: 5
        version:
          type: integer
          minimum: 1
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [source_interview_id]
      properties:
        source_interview_id:
          type: string
          minLength: 1
        goal:
          type: string
          maxLength: 200
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        status:
          type: string
          enum: [todo, in_progress, done, skipped]
        due_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
    PaginatedPlans:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearningPlan'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    TodayResponse:
      type: object
      additionalProperties: false
      required: [date, tasks]
      properties:
        date:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LearningTask'
    ReminderTestRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          type: string
          enum: [in_app]
    ReminderTestResponse:
      type: object
      additionalProperties: false
      required: [notification_id, status]
      properties:
        notification_id:
          type: string
        status:
          type: string
          enum: [pending, sent]
    NextPlanResponse:
      type: object
      additionalProperties: false
      required: [plan_id, tasks, generated_at]
      properties:
        plan_id:
          type: [string, "null"]
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LearningTask'
        generated_at:
          type: [string, "null"]
          format: date-time
