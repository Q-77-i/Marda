[project]
name = "marda-backend"
version = "0.1.0"
description = "Marda 码达 — Agent 智能面试学习平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "qdrant-client>=1.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    # P4 生产化：checkpointer 迁 PostgreSQL（多 worker 共享状态）
    # 版本与 langgraph-checkpoint 4.2.0 配套（3.2.0 起要求 >=4.3.0，会把 langgraph 1.2.11 顶掉）
    "langgraph-checkpoint-postgres==3.1.0",
    # 业务库迁 PostgreSQL（psycopg 3 同步 + 连接池；调用方仍走 asyncio.to_thread）
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # 协调层：会话锁 / per-user 限流 / 全局 LLM 槽（多 worker 共享）
    "redis>=5.2",
    "pyjwt>=2.8",
    "langfuse==4.9.1",
    "python-multipart>=0.0.9",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "edge-tts>=7.3.1",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "langchain-community<0.4",
    "openai>=3.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ragas>=0.3,<0.4",
    # MCP 题库查询 server（P2-M10）：**可选组件**，只有 app/mcp_server 用它。
    # 放 dev 组的理由：容器 `uv sync --no-dev` 天然不进 api 镜像（协议代码与 api 无关），
    # 而本地 `uv sync` / `uv run pytest` 开箱即用（不制造「先装某个 group 才能跑测试」的坑）。
    "mcp>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# P4 集成测试的分组标记：需要真 PG / 真 Redis，没配环境变量就跳过。
#   pytest -m postgres   # 需要 MARDA_TEST_DATABASE_URL / MARDA_TEST_CHECKPOINT_URL
#   pytest -m redis      # 需要 MARDA_TEST_REDIS_URL
markers = [
    "postgres: 需要 PostgreSQL（MARDA_TEST_DATABASE_URL / MARDA_TEST_CHECKPOINT_URL）",
    "redis: 需要 Redis（MARDA_TEST_REDIS_URL）",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
