[project]
name = "marda-backend"
version = "0.1.0"
description = "Marda 码达 — Agent 智能面试学习平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "qdrant-client>=1.12",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
