server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: marda-business
  threads:
    virtual:
      # J3 的 Spring MVC 用虚拟线程跑阻塞 JDBC；Hikari 池仍是 DB 并发上限。
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/marda_business}
    username: ${DB_USER:marda}
    password: ${DB_PASSWORD:marda}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    # 契约里的可选字段允许缺省；不全局裁 null，避免 required-but-null（如 plan_id）被省略。
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # DB 是业务服务的正确性依赖：DB 不可用时 readiness 应为 DOWN。
    db:
      enabled: true

business:
  service-token: ${SERVICE_TOKEN:}
  timezone: ${BUSINESS_TIMEZONE:Asia/Shanghai}
