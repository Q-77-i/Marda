# J6-C：HA 形态的业务服务配置。
#
# 数据层用 Redis Sentinel（master 名与 docker/redis-ha/sentinel.conf 一致）；
# 缓存仍只做加速：Redis 故障时回源 DB（BusinessCache 的 fail-open 语义不变）。
spring:
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:marda-master}
        nodes: ${REDIS_SENTINEL_NODES:sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
  # J8-B：Kafka producer / listener 的 observation 让事件链也进同一条 trace。
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

# J8-B：HA 形态开启 OTel（应用侧全采样，由 collector 做 tail sampling）。
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
