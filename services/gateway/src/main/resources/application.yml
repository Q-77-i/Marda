server:
  port: 8080

spring:
  application:
    name: marda-gateway
  cloud:
    gateway:
      routes:
        - id: learning
          uri: ${BUSINESS_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/learning/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  jwt:
    secret: ${JWT_SECRET:}
  service-token: ${SERVICE_TOKEN:}
