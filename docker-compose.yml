# Marda 一键起：nginx（唯一入口） + web + api + qdrant + embedding
# 本地演示：docker compose up -d --build → http://localhost:8080
#
# P4 生产化形态（本文件即该形态）：
# - api 容器内 **2 个 uvicorn worker**（同一容器多进程，共享 PG/Redis 状态）；
# - 业务库 / checkpointer 在 PostgreSQL（两个独立库）；
# - 协调（会话锁 / per-user 限流 / 全局 LLM 槽）在 Redis；
# - 题库仍在 SQLite（离线资产，只读，不迁）。
#
# 单机形态（不启 PG/Redis）走 compose 的 profile：
#   docker compose up -d --build                    # 默认：PG + Redis + api(2 worker)
#   docker compose --profile legacy up -d --build   # 兼容老形态：SQLite + 单 worker
name: marda

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marda}
      POSTGRES_DB: ${POSTGRES_DB:-marda}
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data
      # 初始化脚本：建独立的 checkpoint 库（业务库与 checkpoint 库分开，见 §4.1）
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 只绑回环：宿主机跑迁移脚本 / 测试要连它
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-marda}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 会话锁 / 限流 / LLM 槽：都是短 TTL 的临时状态，不开持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - ./docker/volumes/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - ./docker/volumes/qdrant:/qdrant/storage
    ports:
      # 只绑回环：本机开发（uvicorn 直跑）要连它；Qdrant 无鉴权，绝不对外暴露
      - "127.0.0.1:6333:6333"

  embedding:
    build: ./backend/embedding_service
    restart: unless-stopped
    ports:
      # 只绑回环：宿主机跑 data/scripts/ingest.py（重嵌）要连它
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env            # DEEPSEEK_API_KEY / SILICONFLOW_API_KEY
    environment:
      # 容器内 REPO_ROOT 变了，三个路径显式覆盖（config.py 默认值面向本机开发）
      DB_PATH: /app/data/marda.sqlite3          # 题库（SQLite，只读资产）
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite3
      UPLOAD_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8091
      # ===== P4：业务库 / checkpointer / 协调 =====
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-marda}:${POSTGRES_PASSWORD:-marda}@postgres:5432/${POSTGRES_DB:-marda}
      CHECKPOINT_BACKEND: postgres
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-marda}:${POSTGRES_PASSWORD:-marda}@postgres:5432/marda_checkpoints
      COORDINATION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    # **绝对路径**：镜像里 uvicorn 在 /app/.venv/bin（UV_PROJECT_ENVIRONMENT），
    # 不在 PATH 里——写裸 "uvicorn" 会报 "executable file not found in $PATH"。
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes:
      - ./data:/app/data      # 题库 + 上传图片落宿主机，容器重建不丢
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MARDA_PORT:-8080}:80"
    depends_on:
      - api
      - web

  # ===== 兼容老形态（SQLite + 单 worker）=====
  # 用法：docker compose --profile legacy up -d --build
  api-legacy:
    profiles: ["legacy"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/marda.sqlite3
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite3
      UPLOAD_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8091
      DB_BACKEND: sqlite
      CHECKPOINT_BACKEND: sqlite
      COORDINATION_BACKEND: memory
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
