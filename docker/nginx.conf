# 唯一对外入口：/api → 后端，其余 → 前端（本地 compose 与阶段 3 云服务器同构）

# WebSocket 升级（P2-M5 FR-24：语音识别走 /api/asr 长连接）：
# 没有这两个头，nginx 会在握手处就断掉升级请求，浏览器只看到「连接失败」。
# conf.d 下的文件本身就 include 在 http{} 里，故 map 可以写在这里。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # 上传体量（P2-M6 图片通道）：后端单图上限 8MB，nginx 默认 1m 会在到达 api 前
    # 用 HTML 413 拦掉（前端拿到的就不是我们的 JSON 文案）——留 10m 覆盖 + multipart 余量
    client_max_body_size 10m;

    # 面试接口：SSE 长连接，必须关缓冲，否则事件被 nginx 攒着一起发（打字机失效）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # WS 升级（/api/asr）
        proxy_set_header Connection $connection_upgrade; # 非 WS 请求落 close，不影响既有 SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 一轮问答含 LLM 生成，留足
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
