# P5-J6：Redis Sentinel 模板（单机 HA 演练）。
#
# 3 个哨兵用同一份模板，各自挂在独立的 /data 卷：首次启动复制到 /data/sentinel.conf，
# 之后 Sentinel 会原地重写（epoch / known-sentinel / 当前 master），所以只复制一次。
# quorum=2：3 哨兵里至少 2 个同意才 failover。
bind 0.0.0.0
protected-mode no
port 26379
daemonize no
dir /data
sentinel monitor marda-master 172.31.240.80 6379 2
sentinel down-after-milliseconds marda-master 5000
sentinel failover-timeout marda-master 10000
sentinel parallel-syncs marda-master 1
