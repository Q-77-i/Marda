# J6-A：HA upstream 列表（静态 IP 与 docker-compose.ha.yml 的 IPAM 分配一一对应）。
#
# 为什么用静态 IP 而不是服务名：
# - HA 用 profile 按演练需要选择性启动（core / agent / events）；某个 profile 没起时，
#   服务名在 Docker DNS 里不存在，nginx 在启动解析阶段会直接失败。
# - 静态 IP 让 nginx 始终能启动；目标实例不在时只是连接失败，由被动摘流处理。
# - 重建容器 IP 不变（compose 静态分配），drain/undrain 的 sed 目标也不会漂移。
#
# 改动 IP 时同步改：docker-compose.ha.yml、scripts/ha/drain.sh 的 TARGETS 映射。

upstream gateway_upstream {
    least_conn;
    server 172.31.240.11:8080 max_fails=1 fail_timeout=5s;
    server 172.31.240.12:8080 max_fails=1 fail_timeout=5s;
}

upstream agent_upstream {
    least_conn;
    server 172.31.240.31:8000 max_fails=1 fail_timeout=5s;
    server 172.31.240.32:8000 max_fails=1 fail_timeout=5s;
}

upstream web_upstream {
    server 172.31.240.60:3000 max_fails=1 fail_timeout=5s;
}
