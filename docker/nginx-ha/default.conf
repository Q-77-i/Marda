# J6-A：HA 入口配置。与 dev 的 docker/nginx.p5.conf 区别只有三处：
# - 后端（agent）/ 网关 / 前端都走 upstream（两个实例、被动摘流、least_conn）；
# - 计划内维护用 scripts/ha/drain.sh 把实例标 down 后 reload（不依赖 nginx Plus）；
# - 用静态 IP 指向 HA compose 网络里的固定实例（见 docker-compose.ha.yml 的 IPAM 注释），
#   这样某个 profile 没起（如只跑 core）时 nginx 仍能启动，不会因为 DNS 解析不到而上不来。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # 本地健康检查：不依赖任何上游，供 compose healthcheck 用
    location = /nginx-health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # P5 新业务 API：gateway 双实例；GET 在实例故障时被动重试到另一个。
    # 不重试非幂等请求（nginx 默认），避免把 POST 计划创建重复发给下游。
    # connect_timeout 必须短：死实例的 IP 可能被网络黑洞（不是立刻 ECONNREFUSED），
    # 默认 60s 会让客户端先超时、被动重试根本来不及（演练实测：2s 客户端超时全失败）。
    location /api/v1/learning/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 面试接口：SSE / ASR WebSocket 直连 Python（不走 Java 网关）。
    # least_conn 让长连接尽量分散；非幂等 POST 不自动重试（客户端对账 + 重试）。
    location /api/ {
        proxy_pass http://agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location = /healthz {
        proxy_pass http://agent_upstream/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
