# P5-J6：HA 主库的 pg_hba（挂载给 postgres 的 hba_file）。
#
# 为什么自定义：官方 initdb 生成的规则里只有 localhost 的 replication 条目，
# 主从容器之间是 172.31.240.0/24 网段，必须显式加一条 `host replication ...`。
# 认证方式与默认一致（scram-sha-256），不引入信任网段。
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               scram-sha-256
host    replication     replicator      0.0.0.0/0               scram-sha-256
