# P5-J8：Prometheus 抓取配置（HA 形态，容器 DNS；不预设静态 IP）。
#
# 指标端点口径：
# - Java：/actuator/prometheus（business 的 ServiceTokenFilter / gateway 的 SecurityConfig 已放行；
#   仅容器网络可达，nginx 不路由 /actuator）。
# - Python：/metrics（仅容器网络可达）。
# - exporter：各自默认端口。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: marda-ha

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-1:8080", "gateway-2:8080"]

  - job_name: business
    metrics_path: /actuator/prometheus
    static_configs:
      # worker 是同一 business 镜像（worker 角色，SERVER_PORT=8082），消费指标从 worker 抓。
      - targets: ["business-1:8081", "business-2:8081", "worker-1:8082", "worker-2:8082"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:8000", "api-2:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-main:9187", "postgres-exporter-business:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
