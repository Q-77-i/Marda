# Marda **单机形态**（SQLite + 单 worker + 进程内协调）——P4 之前的形态。
#
# 为什么是**独立文件**而不是 compose profile：
# profile 只能「多起一个服务」，**不能把已存在的服务换掉**。
# `docker compose --profile legacy up -d` 会**同时**起默认形态的 api（2 worker + PG）
# 和 api-legacy，nginx 仍然指向 api —— 所谓「回滚」根本没生效。
# （实测：`docker compose --profile legacy config --services` 列出的服务里，
#   postgres / redis / api 都在。）
#
# 所以这里用**独立文件**：它只描述单机形态要起的服务（无 PG / 无 Redis），
# 起法：
#     docker compose -f docker-compose.legacy.yml up -d --build
#     docker compose -f docker-compose.legacy.yml down
#
# 与默认形态**互斥**：两边的 api 都占 8000 端口、nginx 都占 8080，
# 切形态前先 `docker compose down`（默认形态）再起这个。
name: marda

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - ./docker/volumes/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  embedding:
    build: ./backend/embedding_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s

  # **单 worker**（不是 2 个）：单机形态没有跨进程协调，
  # 多 worker 会让进程内闸门（会话锁 / 限流）形同虚设。
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env            # DEEPSEEK_API_KEY / SILICONFLOW_API_KEY
    environment:
      DB_PATH: /app/data/marda.sqlite3
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite3
      UPLOAD_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8091
      # 单机形态：SQLite 业务库 + SQLite checkpoint + 进程内协调
      DB_BACKEND: sqlite
      CHECKPOINT_BACKEND: sqlite
      COORDINATION_BACKEND: memory
    # **绝对路径**：镜像里 uvicorn 在 /app/.venv/bin（UV_PROJECT_ENVIRONMENT），
    # 不在 PATH 里——写裸 "uvicorn" 会报 "executable file not found in $PATH"。
    # `--loop`：Windows 上 uvicorn 默认用 ProactorEventLoop，psycopg 异步模式不支持它
    #（详见 app/graph/checkpointer.py::uvicorn_loop_factory）。Linux 上是空转。
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "app.graph.checkpointer:uvicorn_loop_factory"]
    volumes:
      - ./data:/app/data      # 题库 + 上传图片落宿主机，容器重建不丢
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MARDA_PORT:-8080}:80"
    depends_on:
      - api
      - web
